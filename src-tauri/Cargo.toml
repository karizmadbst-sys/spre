[package]
name = "serpentis"
version = "1.0.0"
description = "SERPENTIS — 3D Poolrooms Horror Survival"
authors = ["SERPENTIS"]
edition = "2021"

[lib]
name = "serpentis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
